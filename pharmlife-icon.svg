<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景：跟平台主色一致 -->
  <rect width="512" height="512" fill="#3b6ea5"/>

  <!-- 頭髮（後層，耳朵後面的部分） -->
  <path d="M136 235 Q128 120 256 108 Q384 120 376 235 L376 205 Q368 145 256 140 Q144 145 136 205 Z" fill="#3a2c22"/>

  <!-- 耳朵 -->
  <circle cx="150" cy="228" r="20" fill="#ffd9ae"/>
  <circle cx="362" cy="228" r="20" fill="#ffd9ae"/>

  <!-- 臉 -->
  <circle cx="256" cy="222" r="112" fill="#ffd9ae"/>

  <!-- 瀏海 -->
  <path d="M144 210 Q150 118 256 112 Q362 118 368 210 Q345 150 256 148 Q167 150 144 210 Z" fill="#3a2c22"/>

  <!-- 腮紅 -->
  <ellipse cx="192" cy="248" rx="22" ry="13" fill="#ff9d8a" opacity="0.55"/>
  <ellipse cx="320" cy="248" rx="22" ry="13" fill="#ff9d8a" opacity="0.55"/>

  <!-- 眼睛 -->
  <circle cx="215" cy="218" r="14" fill="#2c2320"/>
  <circle cx="297" cy="218" r="14" fill="#2c2320"/>
  <circle cx="220" cy="213" r="5" fill="#ffffff"/>
  <circle cx="302" cy="213" r="5" fill="#ffffff"/>

  <!-- 微笑 -->
  <path d="M226 268 Q256 288 286 268" stroke="#a5583f" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- 脖子 -->
  <rect x="236" y="312" width="40" height="46" fill="#ffd9ae"/>

  <!-- 藥師帽 -->
  <path d="M150 165 Q256 78 362 165 L362 140 Q256 55 150 140 Z" fill="#ffffff" stroke="#dde3ea" stroke-width="4"/>
  <g transform="translate(256,108)">
    <rect x="-8" y="-24" width="16" height="48" rx="4" fill="#3b6ea5"/>
    <rect x="-24" y="-8" width="48" height="16" rx="4" fill="#3b6ea5"/>
  </g>

  <!-- 白袍身體 -->
  <path d="M150 512 L166 355 Q256 320 346 355 L362 512 Z" fill="#ffffff" stroke="#dde3ea" stroke-width="4"/>

  <!-- 衣領 -->
  <path d="M216 350 L256 400 L296 350 L280 338 L256 366 L232 338 Z" fill="#3b6ea5"/>

  <!-- 十字徽章 -->
  <g transform="translate(256,432)">
    <rect x="-32" y="-11" width="64" height="22" rx="5" fill="#e0554f"/>
    <rect x="-11" y="-32" width="22" height="64" rx="5" fill="#e0554f"/>
  </g>
</svg>
