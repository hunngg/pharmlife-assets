<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PharmLife</title>

  <!-- iPhone「加入主畫面」用：Q版藥師 icon + 全螢幕 App 化設定 -->
  <link rel="apple-touch-icon" href="https://hunngg.github.io/pharmlife-assets/pharmlife-icon-v4-180.png">
  <link rel="icon" type="image/png" href="https://hunngg.github.io/pharmlife-assets/pharmlife-icon-v4-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PharmLife">
  <style>
    :root {
      --bg: #f7f7f5;
      --card-bg: #ffffff;
      --border: #e4e4e0;
      --text: #1f2328;
      --text-muted: #6b7280;
      --accent: #3b6ea5;
      --accent-bg: #eaf1f8;
      --tag-bg: #eef0f2;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
      --dot: #e0554f;
      --danger: #e0554f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card-bg: #1e2127;
        --border: #2c3038;
        --text: #e6e8eb;
        --text-muted: #9aa1ab;
        --accent: #7fb0e6;
        --accent-bg: #223245;
        --tag-bg: #262a31;
        --shadow: 0 1px 3px rgba(0,0,0,0.3);
        --dot: #f19188;
        --danger: #f19188;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      /* env(safe-area-inset-top) 避免加入主畫面全螢幕模式時，內容被狀態列(時間/電量)遮住 */
      padding: calc(32px + env(safe-area-inset-top, 0px)) 16px calc(60px + env(safe-area-inset-bottom, 0px));
    }
    header { margin-bottom: 24px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.2px; }
    header p { margin: 0; color: var(--text-muted); font-size: 0.88rem; }
    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 12px;
      color: var(--text);
    }
    section + section { margin-top: 28px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card.active:hover { border-color: var(--accent); transform: translateY(-1px); }
    .card.disabled { opacity: 0.6; cursor: default; }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-name { font-size: 1.02rem; font-weight: 600; }
    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--tag-bg);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); }
    .card-stat {
      margin-top: auto;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-bg);
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      width: fit-content;
    }
    .card-stat.skeleton {
      color: transparent;
      background: var(--tag-bg);
      border-radius: 6px;
      width: 80px;
      height: 1.4em;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* 資產配置比例橫條（呼應計算機工具本身的長條圖呈現方式） */
    .alloc-bar { margin-top: auto; width: 100%; }
    .alloc-bar-track {
      display: flex;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      background: var(--tag-bg);
    }
    .alloc-bar-fill { height: 100%; transition: width 0.4s ease; }
    .alloc-bar-fill.stock { background: var(--accent); }
    .alloc-bar-fill.cash { background: #9aa5b1; }
    .alloc-bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 5px;
    }
    .alloc-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .alloc-dot.stock { background: var(--accent); }
    .alloc-dot.cash { background: #9aa5b1; }

    footer { margin-top: 32px; text-align: center; color: var(--text-muted); font-size: 0.75rem; }

    /* ===== 運動紀錄日曆（嵌在首頁最上面）===== */
    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .month-bar h2 { font-size: 1.05rem; font-weight: 700; margin: 0; }
    .nav-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

    .calendar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 10px;
      box-shadow: var(--shadow);
      touch-action: pan-y;
      user-select: none;
    }
    .weekday-row, .day-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .weekday-row div {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      padding-bottom: 8px;
      font-weight: 600;
    }
    .day-cell {
      position: relative;
      text-align: center;
      padding: 8px 0 10px;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .day-cell.empty { cursor: default; }
    .day-cell:not(.empty):hover { background: var(--tag-bg); }
    .day-cell.today .day-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
    }
    .day-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3px;
      height: 6px;
      margin-top: 3px;
    }
    .day-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cal-stat-row { margin-top: 12px; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
    .cal-stat-row b { color: var(--accent); }

    dialog {
      border: none;
      border-radius: var(--radius);
      padding: 0;
      width: calc(100% - 32px);
      max-width: 420px;
      background: var(--card-bg);
      color: var(--text);
    }
    dialog::backdrop { background: rgba(0,0,0,0.4); }
    .modal-body { padding: 20px; }
    .modal-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; }

    .entry-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .entry-item:last-of-type { border-bottom: none; }
    .entry-type { font-weight: 600; }
    .entry-meta { color: var(--text-muted); font-size: 0.8rem; }
    .entry-del {
      border: none; background: none; color: var(--danger);
      font-size: 1rem; cursor: pointer; padding: 4px 8px;
    }

    .type-grid {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin: 10px 0 14px;
    }
    .type-chip {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--tag-bg);
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .type-chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
    .type-chip#type-chip-other { background: transparent; border-style: dashed; color: var(--text-muted); }

    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 5px; }
    .form-input, .form-textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
    }
    .form-textarea { min-height: 60px; resize: vertical; }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-secondary { background: var(--tag-bg); color: var(--text); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    .add-new-btn {
      margin-top: 14px;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .wrap { padding: calc(24px + env(safe-area-inset-top, 0px)) 14px calc(48px + env(safe-area-inset-bottom, 0px)); }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>PharmLife</h1>
      <p>個人工作知識平台</p>
    </header>

    <!-- ===== 運動紀錄日曆 ===== -->
    <section>
      <p class="section-title">運動紀錄</p>
      <div class="month-bar">
        <button class="nav-btn" id="prev-month">‹</button>
        <h2 id="month-label"></h2>
        <button class="nav-btn" id="next-month">›</button>
      </div>
      <div class="calendar" id="calendar">
        <div class="weekday-row">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        <div class="day-row" id="day-grid" style="row-gap:4px;"></div>
      </div>
      <div class="cal-stat-row" id="cal-stat-row"></div>
    </section>

    <!-- ===== 工具卡片 ===== -->
    <section>
      <p class="section-title">工具</p>
      <div class="grid" id="tool-grid"></div>
    </section>

    <footer>共 <span id="tool-count">0</span> 項工具 · 之後會持續擴充</footer>
  </div>

  <dialog id="day-dialog">
    <div class="modal-body">
      <div class="modal-title" id="dialog-date-title"></div>
      <div id="entry-list"></div>
      <button class="add-new-btn" id="btn-show-add">+ 記錄運動</button>

      <div id="add-form" style="display:none; margin-top:14px;">
        <div class="form-group">
          <label class="form-label">運動類型</label>
          <div class="type-grid" id="type-grid"></div>
          <div id="new-type-row" style="display:none; gap:8px;">
            <input class="form-input" id="new-type-input" placeholder="輸入新類型名稱...">
            <button class="btn btn-secondary" id="btn-add-type">新增</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">持續時間（分鐘）</label>
          <input class="form-input" id="minutes-input" type="number" inputmode="numeric" placeholder="30">
        </div>
        <div class="form-group">
          <label class="form-label">備註（可留空）</label>
          <textarea class="form-textarea" id="note-input" placeholder="例如：操場慢跑"></textarea>
        </div>
        <button class="btn btn-primary" id="btn-save-entry">儲存</button>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="btn-close-dialog">關閉</button>
      </div>
    </div>
  </dialog>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwbrwsQhfmS-ax0w7swR7ZoFZmjEQE6ircgsdzNI7mOQZVoxRE1HGDNtBfXku994JZt/exec';

    /* ========================================================
     * 運動紀錄日曆
     * ==================================================== */
    // 「其他」不放在這裡當一般選項，改成按下去才跳出新增自訂類型的輸入框（見 renderTypeGrid）
    const DEFAULT_TYPES = ['跑步', '健走', '重訓', '瑜伽', '游泳', '醫院體育課', '健工教練課'];

    // 每種類型對應的日曆紅點顏色：重訓/健工教練課共用一色、跑步/健走/游泳共用一色、
    // 瑜伽自己一色、醫院體育課跟其他(含自訂類型)共用一色當預設
    const TYPE_COLORS = {
      '重訓': '#e0554f',
      '健工教練課': '#e0554f',
      '跑步': '#3b82c4',
      '健走': '#3b82c4',
      '游泳': '#3b82c4',
      '瑜伽': '#9b6bd1',
      '醫院體育課': '#9aa5b1',
      '其他': '#9aa5b1',
    };
    function typeColor(type) {
      return TYPE_COLORS[type] || '#9aa5b1'; // 自訂類型預設跟「其他」同一色
    }

    let calState = {
      records: [],
      customTypes: [],
      year: new Date().getFullYear(),
      month: new Date().getMonth(),
      selectedDate: null,
      selectedType: null,
      showCustomTypeInput: false,
    };

    function pad2(n) { return String(n).padStart(2, '0'); }
    function calDateStr(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }
    function calTodayStr() { const d = new Date(); return calDateStr(d.getFullYear(), d.getMonth(), d.getDate()); }

    async function apiList(module) {
      const res = await fetch(`${API_URL}?module=${module}&action=list`);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error);
      return json.records;
    }
    async function apiPost(payload) {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error);
      return json;
    }

    function allExerciseTypes() {
      return [...DEFAULT_TYPES, ...calState.customTypes];
    }

    function renderMonthLabel() {
      document.getElementById('month-label').textContent = `${calState.year}年 ${calState.month + 1}月`;
    }

    function renderCalendar() {
      renderMonthLabel();
      const grid = document.getElementById('day-grid');
      const firstDay = new Date(calState.year, calState.month, 1).getDay();
      const daysInMonth = new Date(calState.year, calState.month + 1, 0).getDate();
      const today = calTodayStr();

      let html = '';
      for (let i = 0; i < firstDay; i++) html += `<div class="day-cell empty"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = calDateStr(calState.year, calState.month, d);
        const isToday = ds === today ? 'today' : '';
        const dayRecords = calState.records.filter(r => r.date === ds);
        const colors = [...new Set(dayRecords.map(r => typeColor(r.type)))];
        const dotsHtml = colors.map(c => `<span class="day-dot" style="background:${c}"></span>`).join('');
        html += `
          <div class="day-cell ${isToday}" data-date="${ds}">
            <span class="day-num">${d}</span>
            <div class="day-dots">${dotsHtml}</div>
          </div>`;
      }
      grid.innerHTML = html;

      const prefix = `${calState.year}-${pad2(calState.month + 1)}`;
      const monthRecords = calState.records.filter(r => r.date.startsWith(prefix));
      const monthDays = new Set(monthRecords.map(r => r.date)).size;
      document.getElementById('cal-stat-row').innerHTML =
        `本月已運動 <b>${monthDays}</b> 天 · 共 <b>${monthRecords.length}</b> 筆紀錄`;
    }

    function changeMonth(delta) {
      let m = calState.month + delta;
      let y = calState.year;
      if (m < 0) { m = 11; y--; }
      if (m > 11) { m = 0; y++; }
      calState.month = m; calState.year = y;
      renderCalendar();
    }

    function renderTypeGrid() {
      const grid = document.getElementById('type-grid');
      const chips = allExerciseTypes().map(t =>
        `<button type="button" class="type-chip ${calState.selectedType === t ? 'selected' : ''}" data-type="${t}">${t}</button>`
      ).join('');
      // 「其他」不是一般類型，按下去是跳出新增自訂類型的輸入框
      const otherChip = `<button type="button" class="type-chip" id="type-chip-other">其他</button>`;
      grid.innerHTML = chips + otherChip;
    }

    function openDayDialog(ds) {
      calState.selectedDate = ds;
      calState.selectedType = null;
      calState.showCustomTypeInput = false;
      document.getElementById('dialog-date-title').textContent = ds;
      renderEntryList();
      document.getElementById('add-form').style.display = 'none';
      document.getElementById('new-type-row').style.display = 'none';
      document.getElementById('new-type-input').value = '';
      renderTypeGrid();
      document.getElementById('minutes-input').value = '';
      document.getElementById('note-input').value = '';
      document.getElementById('day-dialog').showModal();
    }

    function renderEntryList() {
      const entries = calState.records.filter(r => r.date === calState.selectedDate);
      const list = document.getElementById('entry-list');
      if (entries.length === 0) {
        list.innerHTML = `<p style="color:var(--text-muted); font-size:0.85rem;">這天還沒有紀錄</p>`;
        return;
      }
      list.innerHTML = entries.map(e => `
        <div class="entry-item">
          <div>
            <div class="entry-type">${e.type}</div>
            <div class="entry-meta">${e.minutes} 分鐘${e.note ? ' · ' + e.note : ''}</div>
          </div>
          <button class="entry-del" data-del-id="${e.id}" title="刪除">✕</button>
        </div>
      `).join('');
    }

    async function loadCalendarData() {
      try {
        const [records, types] = await Promise.all([apiList('exercise'), apiList('exerciseTypes')]);
        calState.records = records;
        calState.customTypes = types.map(t => t.name);
      } catch (e) {
        console.error(e);
        document.getElementById('cal-stat-row').textContent = '無法載入資料，請確認網路連線';
      }
      renderCalendar();
    }

    function setupCalendarSwipe() {
      const cal = document.getElementById('calendar');
      let startX = null;
      cal.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
      cal.addEventListener('touchend', e => {
        if (startX == null) return;
        const dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 50) changeMonth(dx > 0 ? -1 : 1);
        startX = null;
      }, { passive: true });
    }

    function setupCalendarEvents() {
      document.getElementById('prev-month').addEventListener('click', () => changeMonth(-1));
      document.getElementById('next-month').addEventListener('click', () => changeMonth(1));

      document.getElementById('day-grid').addEventListener('click', e => {
        const cell = e.target.closest('.day-cell:not(.empty)');
        if (!cell) return;
        openDayDialog(cell.dataset.date);
      });

      document.getElementById('btn-show-add').addEventListener('click', () => {
        document.getElementById('add-form').style.display = 'block';
      });

      document.getElementById('type-grid').addEventListener('click', e => {
        const otherChip = e.target.closest('#type-chip-other');
        if (otherChip) {
          // 「其他」不是可選類型，按下去跳出新增自訂類型的輸入框
          const row = document.getElementById('new-type-row');
          row.style.display = 'flex';
          document.getElementById('new-type-input').focus();
          return;
        }
        const chip = e.target.closest('.type-chip');
        if (!chip) return;
        calState.selectedType = chip.dataset.type;
        renderTypeGrid();
      });

      document.getElementById('btn-add-type').addEventListener('click', async () => {
        const input = document.getElementById('new-type-input');
        const name = input.value.trim();
        if (!name) return;
        if (allExerciseTypes().includes(name)) {
          calState.selectedType = name;
          renderTypeGrid();
          input.value = '';
          document.getElementById('new-type-row').style.display = 'none';
          return;
        }
        try {
          await apiPost({ module: 'exerciseTypes', action: 'add', name });
          calState.customTypes.push(name);
          calState.selectedType = name;
          renderTypeGrid();
          input.value = '';
          document.getElementById('new-type-row').style.display = 'none';
        } catch (e) {
          alert('新增類型失敗，請確認網路連線');
        }
      });

      document.getElementById('btn-save-entry').addEventListener('click', async () => {
        const minutes = parseInt(document.getElementById('minutes-input').value, 10);
        const note = document.getElementById('note-input').value.trim();
        if (!calState.selectedType) { alert('請選擇運動類型'); return; }
        if (!minutes || minutes <= 0) { alert('請輸入持續分鐘數'); return; }
        const btn = document.getElementById('btn-save-entry');
        btn.disabled = true;
        try {
          const { id } = await apiPost({
            module: 'exercise', action: 'add',
            date: calState.selectedDate, type: calState.selectedType, minutes, note,
          });
          const now = new Date().toISOString();
          calState.records.push({ id, date: calState.selectedDate, type: calState.selectedType, minutes, note, createdAt: now, updatedAt: now });
          renderEntryList();
          renderCalendar();
          document.getElementById('add-form').style.display = 'none';
          document.getElementById('minutes-input').value = '';
          document.getElementById('note-input').value = '';
          calState.selectedType = null;
        } catch (e) {
          alert('儲存失敗，請確認網路連線後再試一次');
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById('entry-list').addEventListener('click', async e => {
        const btn = e.target.closest('[data-del-id]');
        if (!btn) return;
        if (!confirm('確定要刪除這筆運動紀錄嗎？')) return;
        const id = btn.dataset.delId;
        try {
          await apiPost({ module: 'exercise', action: 'delete', id });
          calState.records = calState.records.filter(r => r.id !== id);
          renderEntryList();
          renderCalendar();
        } catch (e) {
          alert('刪除失敗，請確認網路連線後再試一次');
        }
      });

      document.getElementById('btn-close-dialog').addEventListener('click', () => {
        document.getElementById('day-dialog').close();
      });
    }

    /* ========================================================
     * 工具卡片
     * ==================================================== */
    const TOOLS = [
      {
        key: 'worklog',
        name: '工作紀錄',
        desc: '快速記錄工作活動，年底自評一鍵匯出',
        url: 'https://hunngg.github.io/work-log/',
        loadStat: async () => {
          const res = await fetch(`${API_URL}?module=worklog&action=list`);
          const json = await res.json();
          if (!json.ok) throw new Error(json.error);
          const year = new Date().getFullYear();
          const count = json.records.filter(r => new Date(r.date).getFullYear() === year).length;
          return `今年累計 ${count} 筆`;
        },
      },
      {
        key: 'maintenance',
        name: '維持稽核',
        desc: '年度維持/晉升所需文件備齊狀態總覽',
        url: `${API_URL}?page=maintenance`,
        loadStat: async () => {
          const res = await fetch(`${API_URL}?module=maintenance&action=list`);
          const json = await res.json();
          if (!json.ok) throw new Error(json.error);
          if (json.records.length === 0) return '尚未同步資料';
          const pending = json.records.filter(r => r.status !== 'Ready').length;
          return pending === 0 ? '全部已備妥' : `還有 ${pending} 項待處理`;
        },
      },
      {
        key: 'inbox',
        name: 'PharmNotes/Ideas',
        desc: '隨手記錄照片/檔案＋筆記，有空再處理',
        url: `${API_URL}?page=inbox`,
        loadStat: async () => {
          const res = await fetch(`${API_URL}?module=inbox&action=list`);
          const json = await res.json();
          if (!json.ok) throw new Error(json.error);
          const pending = json.records.filter(r => r.status === 'pending').length;
          return pending === 0 ? '目前沒有待處理項目' : `待處理 ${pending} 筆`;
        },
      },
      {
        key: 'leverage',
        name: '資產槓桿',
        desc: '股市/現金部位配置與總曝險倍率',
        url: 'https://hunngg.github.io/leverage-calc/',
        visualBar: true, // 用長條圖呈現，呼應計算機工具本身的視覺風格
        loadStat: async () => {
          const res = await fetch(`${API_URL}?module=leverage&action=list`);
          const json = await res.json();
          if (!json.ok) throw new Error(json.error);
          if (json.records.length === 0) return { text: '尚未同步資料' };
          const r = json.records[0];
          const stockPct = Number(r.stockPct);
          const cashPct = Number(r.cashPct);
          const hasAlloc = !isNaN(stockPct) && !isNaN(cashPct);
          const ratio = r.exposureRatio !== '' && r.exposureRatio !== null && !isNaN(Number(r.exposureRatio))
            ? Number(r.exposureRatio).toFixed(2) + 'x' : '—';
          return { text: `曝險倍率 ${ratio}`, stockPct: hasAlloc ? stockPct : null, cashPct: hasAlloc ? cashPct : null };
        },
      },
    ];

    function renderCard(tool) {
      const tag = tool.url ? 'a' : 'div';
      const hrefAttr = tool.url ? `href="${tool.url}" target="_blank" rel="noopener"` : '';
      const statHtml = tool.comingSoon
        ? `<span class="badge">即將推出</span>`
        : `<div data-stat-for="${tool.key}"><span class="card-stat skeleton"></span></div>`;

      return `
        <${tag} class="card ${tool.comingSoon ? 'disabled' : 'active'}" ${hrefAttr}>
          <div class="card-top">
            <span class="card-name">${tool.name}</span>
          </div>
          <span class="card-desc">${tool.desc}</span>
          ${statHtml}
        </${tag}>`;
    }

    function allocBarHtml(stockPct, cashPct) {
      if (stockPct == null || cashPct == null) return '';
      return `
        <div class="alloc-bar">
          <div class="alloc-bar-track">
            <div class="alloc-bar-fill stock" style="width:${stockPct.toFixed(1)}%"></div>
            <div class="alloc-bar-fill cash" style="width:${cashPct.toFixed(1)}%"></div>
          </div>
          <div class="alloc-bar-labels">
            <span><span class="alloc-dot stock"></span>股市 ${stockPct.toFixed(0)}%</span>
            <span><span class="alloc-dot cash"></span>現金 ${cashPct.toFixed(0)}%</span>
          </div>
        </div>`;
    }

    async function initTools() {
      const grid = document.getElementById('tool-grid');
      grid.innerHTML = TOOLS.map(renderCard).join('');
      document.getElementById('tool-count').textContent = TOOLS.length;

      for (const tool of TOOLS) {
        if (!tool.loadStat) continue;
        const container = grid.querySelector(`[data-stat-for="${tool.key}"]`);
        try {
          const result = await tool.loadStat();
          const { text, stockPct, cashPct } = typeof result === 'string' ? { text: result } : result;
          container.innerHTML = `<span class="card-stat">${text}</span>` +
            (tool.visualBar ? allocBarHtml(stockPct, cashPct) : '');
        } catch (e) {
          container.innerHTML = `<span class="card-stat">無法載入</span>`;
        }
      }
    }

    setupCalendarSwipe();
    setupCalendarEvents();
    loadCalendarData();
    initTools();
  </script>
</body>
</html>
